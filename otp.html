<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Viewport Meta-Tag für optimale Darstellung auf mobilen Endgeräten -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP</title>
    <!-- Tailwind CSS für modernes, responsives Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Dunkles, modernes Theme */
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .otp-text {
            font-family: 'Roboto Mono', monospace;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .svg-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 280px;
        }

        /* Rotation, damit der Kreis oben (12 Uhr) beginnt */
        svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Weicher Übergang für den Fortschrittskreis, falls es minimale Ruckler gibt */
        .progress-circle {
            transition: stroke-dashoffset 0.05s linear;
        }
    </style>
</head>
<body>

    <main class="flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto">
        
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-wider text-slate-300">AUTHENTICATOR</h1>
            <p class="text-slate-500 text-sm mt-2">Einmalpasswort läuft ab in <span id="time-left" class="font-bold text-sky-400">30</span>s</p>
        </div>

        <div class="svg-container bg-slate-800/50 rounded-full shadow-[0_0_40px_rgba(0,0,0,0.5)]">
            <!-- SVG Circular Progress Bar -->
            <svg viewBox="0 0 200 200">
                <!-- Hintergrund-Kreis -->
                <circle 
                    cx="100" 
                    cy="100" 
                    r="90" 
                    fill="none" 
                    stroke="#1e293b" 
                    stroke-width="12"
                />
                <!-- Animierter Fortschritts-Kreis -->
                <circle 
                    id="progress-circle"
                    class="progress-circle"
                    cx="100" 
                    cy="100" 
                    r="90" 
                    fill="none" 
                    stroke="#38bdf8" 
                    stroke-width="12"
                    stroke-linecap="round"
                />
            </svg>

            <!-- OTP Anzeige -->
            <div class="absolute flex flex-col items-center">
                <span id="otp-display" class="otp-text text-5xl font-bold tracking-widest text-white">
                    --- ---
                </span>
            </div>
        </div>

    </main>

    <script>
        // Konfiguration
        const DURATION_MS = 30000; // 30 Sekunden
        let startTime = Date.now();
        
        // DOM Elemente
        const progressCircle = document.getElementById('progress-circle');
        const otpDisplay = document.getElementById('otp-display');
        const timeLeftDisplay = document.getElementById('time-left');

        // SVG Kreis Berechnungen
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        
        // Initiale Einstellungen für den Kreis (dasharray = Umfang)
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = 0;

        /**
         * Generiert eine zufällige 6-stellige Zahl und formatiert sie als "XXX XXX"
         */
        function generateOTP() {
            // Zufallszahl zwischen 0 und 999999
            const randomNum = Math.floor(Math.random() * 1000000);
            // Auffüllen mit führenden Nullen, falls die Zahl kleiner als 6 Stellen ist
            const otpString = randomNum.toString().padStart(6, '0');
            // Formatierung in zwei 3er-Blöcke
            const formattedOTP = `${otpString.substring(0, 3)} ${otpString.substring(3, 6)}`;
            
            // Text im DOM aktualisieren mit einer kleinen Fade-Animation
            otpDisplay.style.opacity = 0;
            setTimeout(() => {
                otpDisplay.textContent = formattedOTP;
                otpDisplay.style.opacity = 1;
                otpDisplay.style.transition = 'opacity 0.3s ease';
            }, 150);
        }

        /**
         * Aktualisiert den Fortschrittskreis und den Timer flüssig
         */
        function updateTimer() {
            const now = Date.now();
            const elapsed = now - startTime;
            
            // Wenn 30 Sekunden abgelaufen sind, zurücksetzen und neu generieren
            if (elapsed >= DURATION_MS) {
                startTime = now;
                generateOTP();
            }

            // Fortschritt berechnen (0.0 bis 1.0)
            const progress = (now - startTime) / DURATION_MS;
            
            // Offset berechnen (Kreis leert sich)
            const offset = progress * circumference;
            progressCircle.style.strokeDashoffset = offset;

            // Verbleibende Sekunden für den Text oben aktualisieren
            const secondsLeft = Math.ceil((DURATION_MS - (now - startTime)) / 1000);
            timeLeftDisplay.textContent = secondsLeft;

            // Nächsten Frame anfordern für flüssige Animation
            requestAnimationFrame(updateTimer);
        }

        // Initiale Generierung und Start der Animationsschleife
        generateOTP();
        requestAnimationFrame(updateTimer);

    </script>
</body>
</html>
